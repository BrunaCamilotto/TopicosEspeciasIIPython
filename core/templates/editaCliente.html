<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🖌️ Editar Cliente</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/stylesheet.css' %}">
</head>
<body>

<div class="container py-5">
    <h1 class="text-pink mb-4">🖌️ Cadastrar Novo Cliente</h1>

    <form method="POST" action="{% url 'editaCliente' cliente.id %}" class="mx-auto" style="max-width:600px;">
        {% csrf_token %}
    
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
        </div>
        <input type="text" class="form-control" id="nome" name="nome" value="{{cliente.nome}}" required>
    
        <div class="mb-3">
            <label for="sobrenome" class="form-label">Sobrenome</label>
        </div>
        <input type="text" class="form-control" id="sobrenome" name="sobrenome" value="{{cliente.sobrenome}}" required>
    
        <div class="mb-3">
            <label for="cpf" class="form-label">CPF</label>
        </div>
        <input type="text" class="form-control" id="cpf" name="cpf" value="{{cliente.cpf}}" required>
    
        <div class="mb-3">
            <label for="data_nascimento" class="form-label">Data de Nascimento</label>
        </div>
        <input type="date" class="form-control" id="data_nascimento" name="data_nascimento" value="{{cliente.data_nascimento}}" required>
    
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
        </div>
        <input type="email" class="form-control" id="email" name="email" value="{{cliente.email}}" required>
    
        <div class="mb-3">
            <label for="telefone" class="form-label">Telefone</label>
        </div>
        <input type="text" class="form-control" id="telefone" name="telefone" value="{{cliente.telefone}}">
    
        <div class="text-center">
            <button type="submit" class="btn-pink btn-lg">💖 Alterar Cliente</button>
        </div>
    </form>
    

    <div class="text-center mt-4">
        <a href="{% url 'urlclientes' %}" class="btn-pink">👥 Voltar à Lista de Clientes</a>
    </div>
</div>

<footer>
    💖 Feito com carinho por mim 👩🏻‍🔧 e meu amigo ChatGPT 🤖 💖
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Mascara de telefone -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/inputmask/5.0.8/inputmask.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var telefone = document.getElementById("telefone");
    if (telefone) {
        Inputmask("(99) 99999-9999").mask(telefone);
    }
});
</script>
</body>
</html>
