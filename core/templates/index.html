<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏠 Página Inicial</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/stylesheet.css' %}">
</head>
<body>

<div class="container text-center py-7">
    <h1 class="text-pink">🏠 Bem-vindo ao Sistema de Gestão</h1>

    <div class="center-list mt-15">
        <a href="{% url 'urlclientes' %}" class="btn-pink btn-lg">👥 Lista de Clientes</a>
        <a href="{% url 'produtos' %}" class="btn-pink btn-lg">🛒 Lista de Produtos</a>
        <a href="{% url 'contatos' %}" class="btn-pink btn-lg">📞 Contatos</a>
    </div>

    {% if curso %}
        <h2>📚 Curso Atual: {{ curso }}</h2>
    {% else %}
        <h2>📚 Nenhum curso selecionado</h2>
    {% endif %}
</div>

<footer>
    💖 Feito com carinho por mim 👩🏻‍🔧 e meu amigo ChatGPT 🤖 💖
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
